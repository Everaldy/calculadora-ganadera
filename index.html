<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Registro de Granja</title>
<link rel="stylesheet" href="styles.css">

<a href="https://wa.me/573112361741?text=Hola,%20necesito%20ayuda%20con%20el%20sistema%20de%20granja" 
   class="whatsapp-btn" 
   target="_blank">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp">
</a>

<button onclick="cerrarSesion()" class="btn-salir-flotante">
     Salir
</button>
</head>

<body>
  <div id="loginOverlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(10px);">
    <div class="glass-card" style="width: 320px; padding: 30px; text-align: center; color: white; border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; background: rgba(255,255,255,0.1);">
        <h2>Iniciar Sesión</h2>
        <br>
        <input type="text" id="userIn" placeholder="Usuario" style="width: 90%; padding: 10px; margin-bottom: 15px; border-radius: 8px; border: none;">
        <select id="roleIn" style="width: 97%; padding: 10px; margin-bottom: 15px; border-radius: 8px; border: none;">
            <option value="admin">Administrador (Dueño)</option>
            <option value="vendedor">Vendedor / Operario</option>
        </select>
        <button onclick="entrarSistema()" class="btn-primary" style="width: 100%; padding: 12px; background: #25d366; color: white; border: none; border-radius: 25px; cursor: pointer; font-weight: bold;">
            ENTRAR
        </button>
    </div>
</div>

<h1>Sistema de Registro Productivo de Granja</h1>

<div class="contenedor">

<h2>Registrar Datos</h2>

<label>Selecciona el animal:</label>
<select id="animal" onchange="filtrarAnimal()">
  <option value="">-- Selecciona --</option>
  <option value="vaca">Vaca</option>
  <option value="gallina">Gallina</option>
  <option value="cerdo">Cerdo</option>
</select>

<br><br>

<!-- VACAS -->
<div id="vaca" style="display:none;">
  <label>Vacas:</label>
  <input type="number" id="vacas">

  <label>Litros de leche por día:</label>
  <input type="number" id="leche">

  <label>Precio por litro de leche ($):</label>
  <input type="number" id="precioLeche">
</div>

<!-- GALLINAS -->
<div id="gallina" style="display:none;">
  <label>Gallinas:</label>
  <input type="number" id="gallinas">

  <label>Huevos por día:</label>
  <input type="number" id="huevos">

  <label>Precio por huevo ($):</label>
  <input type="number" id="precioHuevo">
</div>

<!-- CERDOS -->
<div id="cerdo" style="display:none;">
  <label>Cerdos:</label>
  <input type="number" id="cerdos">

  <label>Lechones por mes:</label>
  <input type="number" id="lechones">

  <label>Precio por lechón ($):</label>
  <input type="number" id="precioLechon">
</div>

<br>

<label>Gastos diarios de la granja ($):</label>
<input type="number" id="gastos">

<br><br>

<button onclick="guardarDatos()">Guardar</button>
<button onclick="calcular()">Calcular</button>
<div id="resultadoBox" style="display:none;"></div>

</div>

<div class="contenedor">

<h2>Resumen</h2>

<p id="resultado"></p>
<p id="alertas"></p>

</div>

<script src="script.js"></script>

</body>
</html>
